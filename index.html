<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>SparkLusa | Site em Construção</title>
    <style>
      :root {
        --bg: #f6f8fb;
        --text: #17324d;
        --muted: #5b6b7c;
        --blue: #2f6ea6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(47, 110, 166, 0.14), transparent 28%),
          linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
        color: var(--text);
      }

      .wrap {
        text-align: center;
        display: grid;
        gap: 1.1rem;
        justify-items: center;
      }

      .logo {
        width: min(320px, 72vw);
        height: auto;
        object-fit: contain;
      }

      .message {
        margin: 0;
        font-size: clamp(0.95rem, 3.8vw, 1.25rem);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--blue);
        line-height: 1.25;
        max-width: 16ch;
      }

      .submessage {
        margin: 0;
        max-width: 32rem;
        color: var(--muted);
        line-height: 1.6;
      }

      @media (max-width: 480px) {
        body {
          padding: 1.25rem;
        }

        .wrap {
          gap: 0.85rem;
        }

        .logo {
          width: min(250px, 78vw);
        }

        .message {
          letter-spacing: 0.05em;
          max-width: 10ch;
        }
      }

      .contact {
        display: grid;
        gap: 0.4rem;
        margin-top: 0.5rem;
        color: var(--text);
        font-weight: 600;
      }

      .contact a {
        color: var(--blue);
        text-decoration: none;
      }

      .contact a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="wrap" aria-label="Site em construção">
      <img class="logo" src="media/logo/logo_cropped.png" alt="SparkLusa" />
      <p class="message">Site under construction</p>
      <div class="contact" aria-label="Contactos">
        <a href="mailto:geral@sparklusa.com">geral@sparklusa.com</a>
        <a href="tel:+351918395512">CEO - Gonçalo Alves: 351 918 395 512</a>
      </div>
    </main>
  </body>
</html>
